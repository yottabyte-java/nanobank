spring:

  application:
    name: nanobank-identity-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nanobank_identity}
    username: postgres
    password: 1957

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: when_authorized