spring:

  application:
    name: nanobank-identity-service-test

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info